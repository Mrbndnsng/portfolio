<!DOCTYPE html>
<html>
<head>
<title>Activity 6</title>
<style>
table {
    border-collapse: collapse;
    margin: auto;
}

td {
    border: 2px double black; 
    padding: 20px;        
    text-align: center;
}
</style>
</head>
<body>

<h1 style="text-align:center;">Activity 6</h1>

<table>
  <!-- Top row -->
  <tr>
    <td colspan="3">Top</td>
  </tr>

  <!-- Middle row -->
  <tr>
    <td rowspan="2">Left</td>
    <td>Middle Up</td>
    <td rowspan="2">Right</td>
  </tr>
  <tr>
    <td>Middle Down</td>
  </tr>

  <!-- Bottom row -->
  <tr>
    <td colspan="3">Bottom</td>
  </tr>
</table>

</body>
</html>
