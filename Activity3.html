<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Grade Report</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    text-align: center;
}

h2{
    margin-top: 30px;
}

table{
    margin: auto;
    border-collapse: collapse;
    width: 70%;
    background: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

th, td{
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th{
    background-color: #a8d0e6;
}


.avggrade{
    background-color: #cfe8ff;
    font-weight: bold;
}


.remarks{
    background-color: #fff4b5;
    font-weight: bold;
}

</style>
</head>

<body>

<h3>Activity 3</h3>
<h2>Student Grade Report</h2>

<table>

<tr>
<th>Subject</th>
<th>Instructor</th>

<th>Final</th>
<th>Remarks</th>
</tr>

<tr>
<td>HTML</td>
<td>Mr. Santos</td>

<td>91</td>

</tr>

<tr>
<td>CSS</td>
<td>Ms. Cruz</td>
<td>85</td>
<td>87</td>
<td>90</td>

</tr>

<tr>
<td>JavaScript</td>

<tr class="avggrade">

</tr>

<tr class="remarks">
<td colspan="5">General Remarks</td>
<td>Passed</td>
</tr>

</table>

</body>
</html>
